<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTM Native</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tailwind.css" />
  <style id="simpmusic-ui-css">
    /* ================================================================
       SimpMusic-style desktop layout
       [library card] [center card + floating player capsule] [now playing art panel]
       All colors come from these tokens; theme presets / custom CSS can override them.
       ================================================================ */
    :root {
      --bg: #0b0b0d;
      --card: rgba(20, 20, 22, 0.94);
      --card-2: #1c1c1f;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f2f2f4;
      --muted: #a2a2a8;
      --accent: #8ccbf5;
      --accent-strong: #5fb2ec;
      --on-accent: #062a40;
      --gap: 10px;
      --radius: 18px;
      --drawer-w: clamp(300px, 30vw, 460px);
      --sidebar-w: 280px;
    }
    html, body {
      background: transparent !important;
      color: var(--text);
      font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    body { background-color: var(--bg) !important; }
    html.mica body { background-color: transparent !important; }

    /* Solid accent fills always get readable dark text/icons. */
    .bg-\(--accent\), .sm-on-accent { color: var(--on-accent) !important; }

    .sm-shell {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: var(--gap);
      padding: var(--gap);
      overflow: hidden;
      position: relative;
      z-index: 10;
    }
    .sm-left-zone {
      position: relative;
      display: flex;
      flex: 1;
      min-width: 0;
      gap: var(--gap);
    }
    .m3-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ---------- Sidebar ---------- */
    #sidebar { width: var(--sidebar-w); transition: width 0.18s ease; }
    #sidebar.sidebar-collapsed { width: 76px; }
    #sidebar.sidebar-collapsed .sidebar-label { display: none !important; }
    #sidebar.sidebar-collapsed .m3-nav-item,
    #sidebar.sidebar-collapsed .sm-lib-head,
    #sidebar.sidebar-collapsed #sidebar-playlists > button { justify-content: center; padding-left: 0; padding-right: 0; }
    #sidebar.sidebar-collapsed .sm-lib-head { flex-direction: column; }
    .m3-nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-radius: 9999px;
      border: 1px solid transparent;
      color: var(--text);
      font-weight: 500;
      font-size: 14px;
      transition: background 0.16s ease, border-color 0.16s ease;
      cursor: pointer;
    }
    .m3-nav-item svg { width: 20px; height: 20px; color: var(--muted); }
    .m3-nav-item:hover { background: rgba(255, 255, 255, 0.05); }
    .m3-nav-item.active {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--line-strong);
      color: var(--accent);
      font-weight: 600;
    }
    .m3-nav-item.active svg { color: var(--accent); }

    .sm-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 1px solid var(--line-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.16s ease;
    }
    .sm-icon-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .sm-icon-btn svg { width: 18px; height: 18px; }

    .sm-chip {
      padding: 5px 16px;
      border-radius: 9999px;
      border: 1px solid var(--line-strong);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.16s ease;
    }
    .sm-chip:hover { background: rgba(255, 255, 255, 0.06); }
    .sm-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

    /* ---------- Center card ---------- */
    .sm-center {
      background:
        radial-gradient(120% 260px at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
        var(--card);
    }
    .sm-action-pill {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 9999px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.03);
    }
    .sm-action-pill button {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
    }
    .sm-action-pill button:hover { background: rgba(255, 255, 255, 0.08); }
    .sm-action-pill svg { width: 18px; height: 18px; }

    .sm-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .sm-h2 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }

    /* Quick picks: 4 rows, columns flow horizontally (SimpMusic style) */
    .sm-quick-picks {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(4, auto);
      grid-auto-columns: minmax(260px, 46%);
      gap: 4px 18px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x proximity;
    }
    .sm-quick-picks > * { scroll-snap-align: start; }
    .sm-quick-picks::-webkit-scrollbar { height: 4px; }

    /* Large square cards with the title over the art */
    .sm-big-card { width: 220px; flex-shrink: 0; }
    @container (min-width: 900px) { .sm-big-card { width: 250px; } }
    .sm-big-card .sm-art { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; background: var(--card-2); }
    .sm-big-card .sm-art img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .sm-big-card:hover .sm-art img { transform: scale(1.03); }

    .artist-round { border-radius: 9999px !important; object-fit: cover; }

    /* ---------- Floating player capsule ---------- */
    #player-bar {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(calc(100% - 32px), 940px);
      height: 64px;
      z-index: 30;
      container-type: inline-size;
      background: rgba(28, 28, 32, 0.88);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      border: 1px solid var(--line-strong);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
    .sm-pbtn {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .sm-pbtn:hover { background: rgba(255, 255, 255, 0.08); }
    .sm-pbtn svg { width: 20px; height: 20px; }
    .sm-pbtn.on { color: var(--accent); }
    .sm-divider { width: 1px; height: 30px; background: var(--line-strong); flex-shrink: 0; }
    .seek-rail {
      width: 100%;
      height: 3px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.16);
      position: relative;
      transition: height 0.12s ease;
    }
    #seek-bar-wrap:hover .seek-rail { height: 5px; }
    /* Hide less important capsule items when it gets narrow */
    @container (max-width: 760px) { .sm-cap-opt { display: none !important; } }
    @container (max-width: 600px) { .sm-cap-opt2 { display: none !important; } }

    /* Space so scrolled content never hides behind the floating capsule */
    #main-content { padding-bottom: 104px; }
    #sidebar-playlists { padding-bottom: 84px; }

    /* ---------- Right now-playing panel (album art fills it) ---------- */
    #queue-drawer { width: var(--drawer-w); position: relative; }
    #drawer-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); transition: opacity 0.5s ease; }
    #drawer-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.55) 62%, rgba(0, 0, 0, 0.88) 100%);
      transition: background 0.3s ease, backdrop-filter 0.3s ease;
    }
    #queue-drawer[data-tab="lyrics"] #drawer-shade,
    #queue-drawer[data-tab="queue"] #drawer-shade {
      background: rgba(8, 8, 10, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .sm-tabbar {
      display: flex;
      align-items: center;
      padding: 3px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .sm-tabbar button {
      width: 58px;
      height: 36px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .sm-tabbar button:hover { color: #fff; }
    .sm-tabbar button.active { background: rgba(255, 255, 255, 0.18); color: #fff; }
    .sm-tabbar svg { width: 19px; height: 19px; }

    .sm-lyric { padding: 6px 4px; font-size: 19px; font-weight: 600; line-height: 1.35; color: rgba(255, 255, 255, 0.38); cursor: pointer; transition: color 0.2s ease, transform 0.2s ease; transform-origin: left center; }
    .sm-lyric:hover { color: rgba(255, 255, 255, 0.7); }
    .sm-lyric.active { color: #fff; transform: scale(1.03); }

    /* ---------- Narrow windows ---------- */
    @media (max-width: 1180px) {
      :root { --sidebar-w: 240px; }
      body.queue-open #sidebar { width: 76px; }
      body.queue-open #sidebar .sidebar-label { display: none !important; }
      body.queue-open #sidebar .m3-nav-item,
      body.queue-open #sidebar .sm-lib-head,
      body.queue-open #sidebar #sidebar-playlists > button { justify-content: center; padding-left: 0; padding-right: 0; }
      body.queue-open #sidebar .sm-lib-head { flex-direction: column; }
    }
  </style>
  <style id="theme-preset-css"></style>
  <style id="user-custom-css"></style>
</head>
<body class="text-white h-screen w-screen flex flex-col overflow-hidden relative">

  <!-- ON-DEMAND / FIRST-LAUNCH INTRO VIDEO OVERLAY -->
  <div id="app-splash" class="hidden fixed inset-0 z-50 bg-black flex items-center justify-center transition-all duration-500 overflow-hidden opacity-0">
    <video id="intro-video" playsinline class="w-full h-full object-cover"></video>
    <div class="pointer-events-none absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
    <div id="splash-status" class="fixed bottom-8 left-8 text-xs text-white/60 tracking-wide"></div>
    <button id="btn-skip-intro" onclick="hideSplash()" class="fixed bottom-7 right-7 flex items-center gap-2 px-5 py-2.5 rounded-full bg-black/55 hover:bg-white/20 backdrop-blur-xl border border-white/25 text-sm font-semibold text-white shadow-2xl transition cursor-pointer">
      <span data-i18n="skip">Skip →</span>
    </button>
  </div>

  <!-- AUTOMATIC UPDATE OVERLAY -->
  <div id="auto-update-overlay" class="hidden fixed inset-0 z-40 bg-black/75 backdrop-blur-xl flex items-center justify-center">
    <div class="w-[380px] bg-[#141416]/95 border border-white/15 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-(--accent)/15 border border-(--accent)/40 flex items-center justify-center">
        <svg class="w-6 h-6 text-(--accent) animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4Z"></path>
        </svg>
      </div>
      <div id="auto-update-title" data-i18n="updatingTitle" class="text-base font-semibold text-white mb-1">Downloading update...</div>
      <div id="auto-update-sub" data-i18n="updatingSub" class="text-xs text-neutral-400">The new version will install and restart automatically.</div>
    </div>
  </div>

  <!-- COMPACT STARTUP UPDATE CHECK TOAST -->
  <div id="update-check-toast" class="hidden fixed top-4 right-4 z-40 flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-black/70 backdrop-blur-xl border border-white/15 text-xs text-neutral-200 shadow-xl">
    <svg class="w-3.5 h-3.5 text-(--accent) animate-spin shrink-0" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
      <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4Z"></path>
    </svg>
    <span id="update-check-toast-text" data-i18n="checkingUpdate">Checking for updates...</span>
  </div>

  <!-- MINI PLAYER OVERLAY -->
  <div id="mini-player-overlay" class="hidden fixed inset-0 z-40 bg-[#07070b]/95 backdrop-blur-2xl flex flex-col justify-between p-5 select-none">
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold uppercase tracking-wider text-(--accent)">YTM Native • Mini</span>
      <button onclick="toggleMiniPlayer()" title="Restore Full Window" class="px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 text-xs font-medium text-white cursor-pointer">⤢ Expand</button>
    </div>
    <div class="flex flex-col items-center text-center my-auto px-2">
      <img id="mini-cover" src="" alt="" class="w-48 h-48 rounded-2xl object-cover shadow-2xl border border-white/15 bg-neutral-900 mb-4" />
      <div id="mini-title" class="text-base font-semibold text-white line-clamp-1">No track playing</div>
      <div id="mini-artist" class="text-xs text-neutral-400 mt-0.5 line-clamp-1"></div>
      <div id="mini-lyric-line" class="text-xs font-medium text-(--accent) mt-3 min-h-[1.25rem] line-clamp-2"></div>
    </div>
    <div class="space-y-3">
      <div class="w-full h-1.5 rounded-full bg-white/15 overflow-hidden">
        <div id="mini-seek-fill" class="h-full bg-(--accent) w-0"></div>
      </div>
      <div class="flex items-center justify-center gap-6">
        <button onclick="cmdPrev()" class="text-white/80 hover:text-white cursor-pointer"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button onclick="cmdTogglePause()" class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center shadow-lg cursor-pointer"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button onclick="cmdNext()" class="text-white/80 hover:text-white cursor-pointer"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- AMBIENT BACKDROP (current cover, very soft; shows through the gaps between cards) -->
  <div id="ambient-backdrop-root" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <img id="ambient-bg-img" src="" alt="" class="hidden w-full h-full object-cover scale-125 blur-[120px] opacity-[0.18] saturate-150 transition-opacity duration-700" />
  </div>

  <div class="sm-shell">

    <!-- LEFT ZONE: library card + center card; the floating player capsule sits over both -->
    <div class="sm-left-zone">

      <!-- LIBRARY CARD -->
      <aside id="sidebar" class="m3-card shrink-0 flex flex-col p-3 select-none">
        <nav class="space-y-1">
          <div data-nav="home" onclick="navigate('home')" class="m3-nav-item active">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 3.2 4 9.6V20h5.5v-6h5v6H20V9.6l-8-6.4Z"/></svg>
            <span class="sidebar-label">Ana Sayfa</span>
          </div>
          <div data-nav="explore" onclick="navigate('explore')" class="m3-nav-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="10,10 16,8 14,14 8,16" fill="currentColor"/></svg>
            <span class="sidebar-label">Keşfet</span>
          </div>
          <div data-nav="library" onclick="navigate('library')" class="m3-nav-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6v14M9 6v14M14 7l5 13"/></svg>
            <span class="sidebar-label">Kitaplık</span>
          </div>
          <div data-nav="search" onclick="focusSearch()" class="m3-nav-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
            <span class="sidebar-label">Ara</span>
          </div>
        </nav>

        <div class="h-px bg-white/[0.08] my-3 mx-1"></div>

        <!-- "Your library" header -->
        <div class="sm-lib-head flex items-center gap-2 px-2 mb-3">
          <svg class="w-5 h-5 text-neutral-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="14" rx="2"/><path stroke-linecap="round" d="M3 7v12a2 2 0 0 0 2 2h12M12 13V7l4 2"/></svg>
          <span class="sidebar-label flex-1 text-[15px] font-semibold text-white">Kitaplığın</span>
          <button id="btn-new-playlist" onclick="toggleNewPlaylistBox()" title="Yeni liste oluştur" class="sidebar-label sm-icon-btn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="btn-toggle-sidebar" title="Kitaplığı daralt / genişlet" class="sm-icon-btn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
        </div>

        <!-- New playlist inline input -->
        <div id="new-playlist-box" class="hidden mb-3 flex gap-1.5 px-1">
          <input id="new-playlist-input" type="text" data-i18n-placeholder="playlistPlaceholder" placeholder="Liste adı..." class="flex-1 min-w-0 bg-white/[0.06] border border-white/10 rounded-full px-3 py-1.5 text-xs text-white focus:outline-none focus:border-white/30" />
          <button onclick="createPlaylist()" data-i18n="add" class="px-3 py-1.5 rounded-full bg-(--accent) text-xs font-semibold cursor-pointer">Ekle</button>
        </div>

        <!-- Library filter chips -->
        <div class="sidebar-label flex items-center gap-1.5 px-1 mb-3 overflow-x-auto no-scrollbar">
          <button id="lib-chip-all" onclick="setLibFilter('all')" class="sm-chip active">Tümü</button>
          <button id="lib-chip-playlists" onclick="setLibFilter('playlists')" class="sm-chip">Listeler</button>
          <button id="lib-chip-artists" onclick="setLibFilter('artists')" class="sm-chip">Sanatçılar</button>
        </div>

        <!-- Library list -->
        <div id="sidebar-playlists" class="flex-1 overflow-y-auto space-y-0.5 pr-1 -mr-1"></div>
      </aside>

      <!-- CENTER CARD -->
      <section class="m3-card sm-center flex-1 flex flex-col min-w-0 relative">
        <!-- Top row: account, history, search, actions -->
        <div class="shrink-0 flex items-center gap-2.5 px-4 pt-3.5 pb-2 relative z-20">
          <button id="btn-account-avatar" onclick="navigate('account')" title="Hesap ve Ayarlar" class="w-9 h-9 rounded-full bg-neutral-700 flex items-center justify-center text-xs font-bold text-white cursor-pointer shrink-0"></button>
          <button onclick="navBack()" title="Geri" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-neutral-300 hover:text-white transition cursor-pointer shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
          </button>
          <button onclick="navForward()" title="İleri" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-neutral-300 hover:text-white transition cursor-pointer shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
          </button>

          <div id="search-box-wrap" class="relative flex-1 min-w-[140px] max-w-[480px]">
            <div class="flex items-center gap-2.5 bg-white/[0.06] hover:bg-white/[0.09] border border-white/[0.10] focus-within:border-white/30 focus-within:bg-white/[0.09] rounded-full px-4 h-10 transition">
              <svg class="w-4 h-4 text-neutral-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="m20 20-3.5-3.5" />
              </svg>
              <input id="search-input" type="text" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="Şarkı, albüm, sanatçı ara" class="w-full bg-transparent text-[13.5px] text-white placeholder-neutral-400 focus:outline-none" />
            </div>
            <div id="search-suggestions" class="hidden absolute left-0 right-0 top-12 rounded-2xl bg-[#18181b]/[0.97] backdrop-blur-2xl border border-white/15 shadow-[0_18px_50px_rgba(0,0,0,0.8)] py-1.5 max-h-[70vh] overflow-y-auto z-50"></div>
          </div>

          <!-- Shown only when an update is available (renderNav) -->
          <button id="btn-updater-pill" onclick="navigate('updates')" class="hidden"></button>

          <div class="sm-action-pill shrink-0 ml-auto">
            <button id="btn-pin-top" onclick="toggleAlwaysOnTop()" title="Her zaman üstte">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 4h6l-1 6 3 3H7l3-3-1-6ZM12 13v7"/></svg>
            </button>
            <button id="btn-mini-player" onclick="toggleMiniPlayer()" title="Mini oynatıcı (Ctrl+M)">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="6" height="4" rx="1" fill="currentColor"/></svg>
            </button>
            <button onclick="navigate('account')" title="Ayarlar">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
            </button>
          </div>
        </div>

        <div id="status-banner" class="hidden mx-5 mt-1 px-3.5 py-2 rounded-xl text-xs backdrop-blur-md"></div>

        <main id="main-content" class="@container flex-1 overflow-y-auto px-6 pt-3"></main>
      </section>

      <!-- FLOATING PLAYER CAPSULE -->
      <footer id="player-bar" class="flex items-center gap-1 pl-3 pr-4 select-none">
        <!-- Transport -->
        <button id="btn-shuffle" onclick="cmdToggleShuffle()" title="Karıştır" class="sm-pbtn sm-cap-opt2">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button onclick="cmdPrev()" title="Önceki (Ctrl+Sol)" class="sm-pbtn">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="btn-play-pause" onclick="cmdTogglePause()" title="Oynat / Duraklat (Space)" class="sm-pbtn w-11 h-11">
          <svg id="icon-play" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
          <svg id="icon-loading" class="w-6 h-6 hidden animate-spin text-(--accent)" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4Z"></path></svg>
        </button>
        <button onclick="cmdNext()" title="Sonraki (Ctrl+Sağ)" class="sm-pbtn">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-repeat" onclick="cmdCycleRepeat()" title="Tekrarla" class="sm-pbtn relative sm-cap-opt2">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span id="repeat-one-badge" class="hidden absolute top-0.5 right-0.5 text-[9px] font-bold text-(--accent)">1</span>
        </button>

        <div class="sm-divider mx-2"></div>

        <!-- Track info + thin progress -->
        <div class="flex-1 min-w-0 flex items-center gap-3">
          <img id="player-cover" src="" alt="" onclick="openDrawerTab('now')" class="w-10 h-10 rounded-lg object-cover bg-neutral-800 shrink-0 cursor-pointer" />
          <div class="min-w-0 flex-1">
            <div class="flex items-baseline gap-2 min-w-0">
              <div id="player-title" class="text-[13.5px] font-semibold text-white truncate">Şarkı seçilmedi</div>
              <span class="ml-auto shrink-0 text-[10.5px] text-neutral-400 tabular-nums sm-cap-opt"><span id="player-time-cur">0:00</span> / <span id="player-time-dur">0:00</span></span>
            </div>
            <div id="player-artist" onclick="openCurrentTrackArtist()" class="text-[12px] text-neutral-400 hover:text-white hover:underline truncate cursor-pointer">Dinlemeye başlamak için bir şarkı seç</div>
            <div id="seek-bar-wrap" class="h-2.5 flex items-center cursor-pointer -mb-1">
              <div class="seek-rail">
                <div id="seek-bar-fill" class="h-full rounded-full bg-white w-0"></div>
              </div>
            </div>
            <span id="player-time" class="hidden">0:00 / 0:00</span>
          </div>
        </div>

        <div class="sm-divider mx-2"></div>

        <!-- Actions -->
        <button id="btn-player-like" onclick="cmdLikeCurrent()" title="Beğen" class="sm-pbtn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
        </button>
        <button onclick="openDrawerTab('queue')" title="Sıradakiler" class="sm-pbtn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h12M4 12h12M4 18h8M18 14v6l4-3-4-3Z"/></svg>
        </button>
        <button onclick="openDrawerTab('lyrics')" title="Şarkı sözleri" class="sm-pbtn sm-cap-opt">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v10H8l-4 4V5Z"/><path stroke-linecap="round" d="M8 9h8M8 12h5"/></svg>
        </button>
        <button id="btn-toggle-queue" onclick="toggleQueue()" title="Şimdi çalıyor paneli" class="sm-pbtn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
        </button>
        <div class="relative sm-cap-opt">
          <button id="btn-sleep" onclick="toggleSleepMenu()" title="Uyku zamanlayıcısı" class="sm-pbtn text-xs">🌙</button>
          <div id="sleep-menu" class="hidden absolute bottom-12 right-0 w-44 bg-[#1c1c1f] border border-white/15 rounded-2xl shadow-xl py-1.5 z-50 text-xs">
            <div data-i18n="sleepTimer" class="px-3 py-1 text-[10.5px] uppercase tracking-wider text-neutral-400">Sleep Timer</div>
            <button data-i18n="sleepOff" onclick="setSleep(null, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">Off</button>
            <button data-i18n="sleepAfterTrack" onclick="setSleep(null, true)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">After this track</button>
            <button data-i18n="min15" onclick="setSleep(15, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">15 minutes</button>
            <button data-i18n="min30" onclick="setSleep(30, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">30 minutes</button>
            <button data-i18n="min45" onclick="setSleep(45, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">45 minutes</button>
            <button data-i18n="min60" onclick="setSleep(60, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">60 minutes</button>
          </div>
        </div>
        <button id="btn-mute" onclick="cmdToggleMute()" title="Sesi kapat / aç" class="sm-pbtn">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.85" class="ytm-vol w-20 cursor-pointer sm-cap-opt" />
        <span id="player-quality" class="hidden"></span>
      </footer>
    </div>

    <!-- RIGHT: NOW PLAYING PANEL (album art fills the card) -->
    <aside id="queue-drawer" data-tab="now" class="m3-card hidden shrink-0 flex-col select-none">
      <img id="drawer-art" src="" alt="" />
      <div id="drawer-shade"></div>

      <div class="relative z-10 flex flex-col h-full min-h-0 p-4">
        <div class="flex items-center justify-between shrink-0">
          <button onclick="toggleQueue()" title="Paneli gizle" class="w-10 h-10 rounded-full bg-black/35 hover:bg-black/55 backdrop-blur-md flex items-center justify-center text-white cursor-pointer transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
          </button>
          <span id="drawer-tab-title" class="text-xs font-semibold uppercase tracking-wider text-white/70"></span>
        </div>

        <!-- TAB: now playing (info sits at the bottom, over the art) -->
        <div id="now-playing-panel" class="flex-1 min-h-0 flex flex-col justify-end"></div>

        <!-- TAB: synced lyrics -->
        <div id="lyrics-panel" class="hidden flex-1 min-h-0 overflow-y-auto no-scrollbar mt-3 pr-1"></div>

        <!-- TAB: up next -->
        <div id="queue-list" class="hidden flex-1 min-h-0 overflow-y-auto mt-3 space-y-1 pr-1"></div>

        <!-- Tab bar -->
        <div class="shrink-0 flex justify-center pt-4">
          <div class="sm-tabbar">
            <button id="tab-drawer-lyrics" onclick="switchDrawerTab('lyrics')" title="Şarkı sözleri">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v10H8l-4 4V5Z"/><path stroke-linecap="round" d="M8 9h8M8 12h5"/></svg>
            </button>
            <button id="tab-drawer-now" onclick="switchDrawerTab('now')" title="Şimdi çalıyor" class="active">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>
            </button>
            <button id="tab-drawer-queue" onclick="switchDrawerTab('queue')" title="Sıradakiler">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h12M4 12h12M4 18h8M18 14v6l4-3-4-3Z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
