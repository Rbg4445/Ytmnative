<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTM Native</title>
  <link rel="stylesheet" href="tailwind.css" />
  <style id="bento-ui-css">
    /* Bento 3-Pane Studio Layout (Spotify-inspired usable card layout + YTM glass) */
    .bento-shell {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 8px;
      padding: 0 8px 8px 8px;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }
    .bento-card {
      background: rgba(18, 18, 22, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      overflow: hidden;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 900px) {
      .quick-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    .quick-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.16s ease;
      padding-right: 10px;
    }
    .quick-tile:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .quick-tile-play {
      margin-left: auto;
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      background: #FF0033;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(3px);
      transition: all 0.16s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }
    .quick-tile:hover .quick-tile-play,
    .quick-tile.active .quick-tile-play {
      opacity: 1;
      transform: translateY(0);
    }
    .artist-round {
      border-radius: 9999px !important;
      object-fit: cover;
    }
    .seek-rail {
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.18);
      position: relative;
      transition: height 0.12s ease;
    }
    .group:hover .seek-rail {
      height: 6px;
    }
  </style>
  <style id="theme-preset-css"></style>
  <style id="user-custom-css"></style>
</head>
<body class="bg-transparent text-white h-screen w-screen flex flex-col overflow-hidden relative">

  <!-- ON-DEMAND / FIRST-LAUNCH INTRO VIDEO OVERLAY (0 bytes RAM when not active!) -->
  <div id="app-splash" class="hidden fixed inset-0 z-50 bg-black flex items-center justify-center transition-all duration-500 overflow-hidden opacity-0">
    <video id="intro-video" playsinline class="w-full h-full object-cover"></video>
    <div class="pointer-events-none absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
    <div id="splash-status" class="fixed bottom-8 left-8 text-xs text-white/60 tracking-wide"></div>
    <button id="btn-skip-intro" onclick="hideSplash()" class="fixed bottom-7 right-7 flex items-center gap-2 px-5 py-2.5 rounded-full bg-black/55 hover:bg-[#FF0033] backdrop-blur-xl border border-white/25 hover:border-[#FF0033] text-sm font-semibold text-white shadow-2xl transition cursor-pointer">
      <span data-i18n="skip">Skip →</span>
    </button>
  </div>

  <!-- AUTOMATIC UPDATE OVERLAY (shows when a newer GitHub Release is downloading/installing) -->
  <div id="auto-update-overlay" class="hidden fixed inset-0 z-40 bg-black/75 backdrop-blur-xl flex items-center justify-center">
    <div class="w-[380px] bg-[#141418]/90 border border-white/15 rounded-2xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-[#FF0033]/15 border border-[#FF0033]/40 flex items-center justify-center">
        <svg class="w-6 h-6 text-[#FF0033] animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4Z"></path>
        </svg>
      </div>
      <div id="auto-update-title" data-i18n="updatingTitle" class="text-base font-bold text-white mb-1">Downloading update...</div>
      <div id="auto-update-sub" data-i18n="updatingSub" class="text-xs text-neutral-400">The new version will install and restart automatically.</div>
    </div>
  </div>

  <!-- COMPACT 5-SECOND STARTUP UPDATE CHECK TOAST -->
  <div id="update-check-toast" class="hidden fixed top-4 right-4 z-40 flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-black/70 backdrop-blur-xl border border-white/15 text-xs text-neutral-200 shadow-xl">
    <svg class="w-3.5 h-3.5 text-[#FF0033] animate-spin shrink-0" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
      <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4Z"></path>
    </svg>
    <span id="update-check-toast-text" data-i18n="checkingUpdate">Checking for updates...</span>
  </div>

  <!-- COMPACT MINI PLAYER OVERLAY (active when Mini Player mode is toggled!) -->
  <div id="mini-player-overlay" class="hidden fixed inset-0 z-40 bg-[#07070b]/95 backdrop-blur-2xl flex flex-col justify-between p-5 select-none">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold uppercase tracking-wider text-[#FF0033]">YTM Native • Mini</span>
      <button onclick="toggleMiniPlayer()" title="Restore Full Window" class="px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 text-xs font-medium text-white cursor-pointer">⤢ Expand</button>
    </div>
    <div class="flex flex-col items-center text-center my-auto px-2">
      <img id="mini-cover" src="" alt="" class="w-48 h-48 rounded-2xl object-cover shadow-2xl border border-white/15 bg-neutral-900 mb-4" />
      <div id="mini-title" class="text-base font-bold text-white line-clamp-1">No track playing</div>
      <div id="mini-artist" class="text-xs text-neutral-400 mt-0.5 line-clamp-1"></div>
      <div id="mini-lyric-line" class="text-xs font-medium text-[#FF4D6D] mt-3 min-h-[1.25rem] line-clamp-2"></div>
    </div>
    <div class="space-y-3">
      <div class="w-full h-1.5 rounded-full bg-white/15 overflow-hidden">
        <div id="mini-seek-fill" class="h-full bg-[#FF0033] w-0"></div>
      </div>
      <div class="flex items-center justify-center gap-6">
        <button onclick="cmdPrev()" class="text-white/80 hover:text-white cursor-pointer"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button onclick="cmdTogglePause()" class="w-12 h-12 rounded-full bg-[#FF0033] hover:bg-[#e0002d] flex items-center justify-center text-white shadow-lg cursor-pointer"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button onclick="cmdNext()" class="text-white/80 hover:text-white cursor-pointer"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- DYNAMIC AMBIENT GLASS BACKDROP (transparent on Windows 11 so OS MicaDark blur shines through!) -->
  <div id="ambient-backdrop-root" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-transparent">
    <div class="absolute -top-32 -left-24 w-[520px] h-[520px] rounded-full bg-[#FF0033]/[0.14] blur-[130px]"></div>
    <div class="absolute bottom-0 right-0 w-[460px] h-[460px] rounded-full bg-[#8b0a28]/[0.12] blur-[140px]"></div>
    <img id="ambient-bg-img" src="" alt="" class="hidden w-full h-full object-cover scale-125 blur-[110px] opacity-[0.22] saturate-150 transition-opacity duration-700" />
    <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/65 to-black/85"></div>
  </div>

  <!-- TOP NAVIGATION BAR (Spotify/Modern Desktop Style: Brand + Back/Forward + Centered Home Pill & Omni-Search + Right Tools) -->
  <header class="h-14 shrink-0 flex items-center justify-between px-3 gap-3 relative z-30 select-none">
    <!-- Left: Sidebar Toggle + Brand + History Back/Forward -->
    <div class="flex items-center gap-2">
      <button id="btn-toggle-sidebar" title="Kitaplığı daralt / genişlet" class="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-neutral-300 hover:text-white transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
      <div id="brand-logo" class="flex items-center gap-2 cursor-pointer pr-1" onclick="navigate('home')">
        <svg class="w-7 h-7 shrink-0" viewBox="0 0 28 28">
          <defs>
            <linearGradient id="ytmLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF2A55"/>
              <stop offset="100%" stop-color="#CC0029"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="26" height="26" rx="7" fill="url(#ytmLogoGrad)" />
          <rect x="6.5" y="11.5" width="2.6" height="7" rx="1.3" fill="#FFFFFF" fill-opacity="0.92" />
          <rect x="10.6" y="7" width="2.6" height="14" rx="1.3" fill="#FFFFFF" />
          <rect x="14.8" y="9" width="2.6" height="12" rx="1.3" fill="#FFFFFF" fill-opacity="0.95" />
          <rect x="18.9" y="12.5" width="2.6" height="6" rx="1.3" fill="#FFFFFF" fill-opacity="0.88" />
        </svg>
        <span class="text-[16px] font-bold tracking-tight text-white hidden sm:inline">YTM Native</span>
      </div>
      <div class="flex items-center gap-1 ml-1">
        <button onclick="navBack()" title="Geri" class="w-8 h-8 rounded-full bg-black/50 hover:bg-white/15 flex items-center justify-center text-neutral-300 hover:text-white transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
        </button>
        <button onclick="navForward()" title="İleri" class="w-8 h-8 rounded-full bg-black/50 hover:bg-white/15 flex items-center justify-center text-neutral-300 hover:text-white transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Center: Home Button + Pill Search Box + Explore Button -->
    <div class="flex items-center justify-center gap-2 flex-1 max-w-[560px]">
      <button data-nav="home" onclick="navigate('home')" title="Ana Sayfa" class="nav-top-pill w-10 h-10 rounded-full bg-[#1f1f24] hover:bg-white/20 border border-white/10 flex items-center justify-center text-white transition cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3.2 4 9.6V20h5.5v-6h5v6H20V9.6l-8-6.4Z"/></svg>
      </button>

      <div id="search-box-wrap" class="relative flex-1">
        <div class="flex items-center gap-3 bg-[#1f1f24]/90 hover:bg-[#28282f] border border-white/[0.10] focus-within:bg-[#1a1a20] focus-within:border-white/35 rounded-full px-4 h-10 transition shadow-inner">
          <svg class="w-4 h-4 text-neutral-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="m20 20-3.5-3.5" />
          </svg>
          <input id="search-input" type="text" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="Ne çalmak istiyorsun? (Şarkı, sanatçı, albüm...)" class="w-full bg-transparent text-[13.5px] text-white placeholder-neutral-400 focus:outline-none" />
          <button onclick="navigate('explore')" title="Keşfet / Gözat" class="pl-2.5 border-l border-white/15 text-neutral-300 hover:text-white transition cursor-pointer shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="10,10 16,8 14,14 8,16" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="search-suggestions" class="hidden absolute left-0 right-0 top-12 rounded-xl bg-[#141418]/95 backdrop-blur-2xl border border-white/15 shadow-[0_18px_50px_rgba(0,0,0,0.85)] py-1.5 overflow-hidden z-50"></div>
      </div>
    </div>

    <!-- Right: Refresh + Right Panel Toggle + Pin + Mini Player + Account -->
    <div class="flex items-center gap-2">
      <button id="btn-header-refresh" onclick="refreshHome(true)" title="Önerileri Yenile (F5)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.08] hover:bg-white/[0.16] border border-white/[0.10] text-xs font-medium text-neutral-200 transition cursor-pointer">
        <svg id="icon-header-refresh" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-2.64-6.36L21 8m0-5v5h-5"/></svg>
        <span data-i18n="refresh" class="hidden md:inline">Refresh</span>
      </button>
      <button id="btn-toggle-queue" onclick="toggleQueue()" title="Şimdi Çalıyor / Sözler / Sıra" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.08] hover:bg-white/[0.16] border border-white/[0.10] text-xs font-medium text-[#FF0033] transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h10M4 18h10M18 12v6l4-3-4-3Z"/></svg>
        <span data-i18n="queueLyrics" class="hidden lg:inline">Panel</span>
      </button>
      <button id="btn-pin-top" onclick="toggleAlwaysOnTop()" title="Her Zaman Üstte" class="w-8 h-8 rounded-full bg-white/[0.08] hover:bg-white/[0.16] border border-white/[0.10] flex items-center justify-center text-xs text-neutral-300 hover:text-white transition cursor-pointer">📌</button>
      <button id="btn-mini-player" onclick="toggleMiniPlayer()" title="Mini Oynatıcı (Ctrl+M)" class="w-8 h-8 rounded-full bg-white/[0.08] hover:bg-white/[0.16] border border-white/[0.10] flex items-center justify-center text-xs text-neutral-300 hover:text-white transition cursor-pointer">⧉</button>
      <button id="btn-account-avatar" onclick="navigate('account')" title="Hesap ve Ayarlar" class="w-8 h-8 rounded-full bg-white/20 border border-white/20 hover:ring-2 hover:ring-white/40 flex items-center justify-center text-xs font-bold text-white transition cursor-pointer">
      </button>
    </div>
  </header>

  <!-- 3-PANE BENTO WORKSPACE: [LEFT LIBRARY CARD] + [CENTER CONTENT CARD] + [RIGHT NOW PLAYING / ARTIST / LYRICS CARD] -->
  <div class="bento-shell">

    <!-- LEFT CARD: KİTAPLIĞIN (Playlists, Liked Songs, Followed & Recent Artists with Filter Pills & Search) -->
    <aside id="sidebar" class="bento-card w-[280px] shrink-0 flex flex-col px-3 py-3 transition-all duration-150 select-none">
      <!-- Header: Kitaplığın + Oluştur -->
      <div class="flex items-center justify-between px-1.5 mb-3">
        <button onclick="navigate('library')" class="flex items-center gap-2.5 text-neutral-300 hover:text-white font-bold text-[15px] transition cursor-pointer">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6v14M9 6v14M14 7l5 13"/></svg>
          <span data-i18n="navLibrary" class="sidebar-label truncate">Kitaplığın</span>
        </button>
        <button id="btn-new-playlist" onclick="toggleNewPlaylistBox()" class="sidebar-label flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.09] hover:bg-white/[0.18] text-xs font-semibold text-white transition cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          <span>Oluştur</span>
        </button>
      </div>

      <!-- New Playlist Inline Input -->
      <div id="new-playlist-box" class="hidden mb-2.5 flex gap-1.5 px-1">
        <input id="new-playlist-input" type="text" data-i18n-placeholder="playlistPlaceholder" placeholder="Çalma listesi adı..." class="flex-1 min-w-0 bg-[#1a1a1a] border border-white/15 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-white/40" />
        <button onclick="createPlaylist()" data-i18n="add" class="px-2.5 py-1.5 rounded-lg bg-[#FF0033] hover:bg-[#e0002d] text-xs font-medium text-white cursor-pointer">Ekle</button>
      </div>

      <!-- Library Filter Chips (Tümü | Çalma Listeleri | Sanatçılar) -->
      <div class="sidebar-label flex items-center gap-1.5 overflow-x-auto no-scrollbar px-1 mb-2.5">
        <button id="lib-chip-all" onclick="setLibFilter('all')" class="px-3 py-1 rounded-full text-xs font-medium bg-white text-black transition cursor-pointer shrink-0">Tümü</button>
        <button id="lib-chip-playlists" onclick="setLibFilter('playlists')" class="px-3 py-1 rounded-full text-xs font-medium bg-white/[0.08] hover:bg-white/[0.15] text-white transition cursor-pointer shrink-0">Çalma Listeleri</button>
        <button id="lib-chip-artists" onclick="setLibFilter('artists')" class="px-3 py-1 rounded-full text-xs font-medium bg-white/[0.08] hover:bg-white/[0.15] text-white transition cursor-pointer shrink-0">Sanatçılar</button>
      </div>

      <!-- Library Quick Filter Input -->
      <div class="sidebar-label px-1 mb-2">
        <div class="flex items-center gap-2 bg-white/[0.05] border border-white/[0.07] rounded-lg px-2.5 py-1.5">
          <svg class="w-3.5 h-3.5 text-neutral-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="m20 20-3.5-3.5" /></svg>
          <input id="lib-search-input" type="text" oninput="setLibSearch(this.value)" placeholder="Kitaplığında ara..." class="w-full bg-transparent text-xs text-white placeholder-neutral-400 focus:outline-none" />
        </div>
      </div>

      <!-- Scrollable Rich Library List (Playlists with covers + Circular Artists) -->
      <div id="sidebar-playlists" class="flex-1 overflow-y-auto space-y-1 pr-1"></div>

      <!-- Bottom Version & Updates Pill -->
      <button id="btn-updater-pill" onclick="navigate('updates')" class="sidebar-label mt-2 pt-2 border-t border-white/10 text-left px-2 py-1 text-[11.5px] text-neutral-400 hover:text-white transition cursor-pointer truncate">
        v3.0.0 • Updates
      </button>
    </aside>

    <!-- CENTER CARD: MAIN SCROLLABLE VIEWPORT -->
    <div class="bento-card flex-1 flex flex-col min-w-0 relative">
      <!-- ERROR / STATUS TOAST -->
      <div id="status-banner" class="hidden mx-6 mt-3 px-3.5 py-2 rounded-lg text-xs backdrop-blur-md"></div>

      <!-- SCROLLABLE MAIN CONTENT -->
      <main id="main-content" class="flex-1 overflow-y-auto px-6 pt-5 pb-8"></main>
    </div>

    <!-- RIGHT CARD: NOW PLAYING STUDIO PANEL (Cover + Track Info + Artist Bio Card + Synced Lyrics + Up Next Queue) -->
    <aside id="queue-drawer" class="bento-card flex w-[320px] shrink-0 flex-col px-4 py-3.5 select-none">
      <!-- Top Row: Tabs (Şimdi Çalıyor | Sözler | Sıradakiler) + Close -->
      <div class="flex items-center justify-between mb-3 border-b border-white/10 pb-2">
        <div class="flex items-center gap-3">
          <button id="tab-drawer-now" onclick="switchDrawerTab('now')" class="text-xs font-bold tracking-wider uppercase text-white border-b-2 border-[#FF0033] pb-1 cursor-pointer">Şimdi Çalıyor</button>
          <button id="tab-drawer-lyrics" data-i18n="lyrics" onclick="switchDrawerTab('lyrics')" class="text-xs font-bold tracking-wider uppercase text-neutral-400 hover:text-white pb-1 cursor-pointer">Sözler</button>
          <button id="tab-drawer-queue" data-i18n="upNext" onclick="switchDrawerTab('queue')" class="text-xs font-bold tracking-wider uppercase text-neutral-400 hover:text-white pb-1 cursor-pointer">Sıra</button>
        </div>
        <button onclick="toggleQueue()" title="Paneli gizle" class="text-neutral-400 hover:text-white text-sm cursor-pointer">✕</button>
      </div>

      <!-- TAB 1: NOW PLAYING + ARTIST CARD + LYRICS PREVIEW (Spotify Right Pane Style!) -->
      <div id="now-playing-panel" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>

      <!-- TAB 2: FULL KARAOKE SYNCED LYRICS -->
      <div id="lyrics-panel" class="hidden flex-1 overflow-y-auto pr-1 text-[14px] leading-relaxed text-neutral-200 whitespace-pre-line"></div>

      <!-- TAB 3: UP NEXT QUEUE -->
      <div id="queue-list" class="hidden flex-1 overflow-y-auto space-y-1 pr-1"></div>
    </aside>
  </div>

  <!-- BOTTOM PLAYER BAR (Spotify/YTM Hybrid: Left Cover+Title+Like | Center Shuffle+Prev+Play+Next+Repeat & Time+SeekBar+Time | Right Lyrics+Queue+Sleep+Volume) -->
  <footer id="player-bar" class="shrink-0 h-[82px] bg-[#09090d]/90 backdrop-blur-2xl border-t border-white/[0.08] px-4 grid grid-cols-3 items-center gap-4 select-none relative z-20">

    <!-- LEFT: Cover + Title / Clickable Artist + Like Heart -->
    <div class="flex items-center gap-3.5 min-w-0">
      <img id="player-cover" src="" alt="" onclick="switchDrawerTab('now'); if (!state.queueOpen) toggleQueue();" class="w-14 h-14 rounded-lg object-cover bg-neutral-800 border border-white/10 shrink-0 cursor-pointer shadow-md" />
      <div class="min-w-0">
        <div id="player-title" class="text-[14px] font-semibold text-white truncate">Şarkı seçilmedi</div>
        <div id="player-artist" onclick="openCurrentTrackArtist()" class="text-[12.5px] text-neutral-400 hover:text-white hover:underline truncate cursor-pointer">Dinlemeye başlamak için bir şarkı seç</div>
      </div>
      <button id="btn-player-like" onclick="cmdLikeCurrent()" title="Beğen" class="ml-1 text-neutral-400 hover:text-white transition cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
      </button>
    </div>

    <!-- CENTER: Transport Buttons + Seek Rail with Time Labels -->
    <div class="flex flex-col items-center justify-center max-w-[600px] w-full mx-auto gap-1.5">
      <div class="flex items-center gap-5">
        <!-- Shuffle -->
        <button id="btn-shuffle" onclick="cmdToggleShuffle()" title="Karıştır" class="p-1.5 rounded hover:bg-white/10 text-neutral-400 hover:text-white transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>

        <!-- Prev -->
        <button onclick="cmdPrev()" title="Önceki (Ctrl+Sol)" class="text-neutral-200 hover:text-white transition cursor-pointer">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <!-- Play / Pause Circle Button -->
        <button id="btn-play-pause" onclick="cmdTogglePause()" title="Oynat / Duraklat (Space)" class="relative w-9 h-9 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition shadow-lg cursor-pointer">
          <svg id="icon-play" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
          <svg id="icon-loading" class="w-5 h-5 hidden animate-spin text-[#FF0033]" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4Z"></path></svg>
        </button>

        <!-- Next -->
        <button onclick="cmdNext()" title="Sonraki (Ctrl+Sağ)" class="text-neutral-200 hover:text-white transition cursor-pointer">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <!-- Repeat -->
        <button id="btn-repeat" onclick="cmdCycleRepeat()" title="Tekrarla" class="relative p-1.5 rounded hover:bg-white/10 text-neutral-400 hover:text-white transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span id="repeat-one-badge" class="hidden absolute -top-0.5 -right-0.5 text-[9px] font-bold text-[#FF0033]">1</span>
        </button>
      </div>

      <!-- Seek Bar Row: 0:00 [======o-----] 3:45 -->
      <div class="w-full flex items-center gap-2.5">
        <span id="player-time-cur" class="text-[11px] text-neutral-400 tabular-nums w-9 text-right">0:00</span>
        <div id="seek-bar-wrap" class="group flex-1 h-4 flex items-center cursor-pointer">
          <div class="seek-rail">
            <div id="seek-bar-fill" class="h-full rounded-full bg-white group-hover:bg-[#FF0033] w-0 relative transition-colors">
              <div class="hidden group-hover:block absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-3 h-3 rounded-full bg-white shadow"></div>
            </div>
          </div>
        </div>
        <span id="player-time-dur" class="text-[11px] text-neutral-400 tabular-nums w-9">0:00</span>
        <span id="player-time" class="hidden">0:00 / 0:00</span>
      </div>
    </div>

    <!-- RIGHT: Quality Badge + Lyrics Button + Queue Button + Sleep Timer + Mute + Volume -->
    <div class="flex items-center justify-end gap-2.5">
      <span id="player-quality" class="text-[10.5px] px-2 py-0.5 rounded bg-white/[0.07] text-neutral-300 hidden xl:inline"></span>

      <!-- Quick Lyrics Drawer Button -->
      <button onclick="openDrawerTab('lyrics')" title="Şarkı Sözleri" class="p-1.5 rounded hover:bg-white/10 text-neutral-300 hover:text-white transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>

      <!-- Quick Queue Drawer Button -->
      <button onclick="openDrawerTab('queue')" title="Sıradakiler" class="p-1.5 rounded hover:bg-white/10 text-neutral-300 hover:text-white transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>

      <!-- Sleep Timer -->
      <div class="relative">
        <button id="btn-sleep" onclick="toggleSleepMenu()" title="Uyku Zamanlayıcısı" class="px-2 py-1 rounded hover:bg-white/10 text-xs text-neutral-400 hover:text-white transition cursor-pointer">🌙</button>
        <div id="sleep-menu" class="hidden absolute bottom-10 right-0 w-44 bg-[#181818] border border-white/15 rounded-lg shadow-xl py-1.5 z-50 text-xs">
          <div data-i18n="sleepTimer" class="px-3 py-1 text-[10.5px] uppercase tracking-wider text-neutral-400">Sleep Timer</div>
          <button data-i18n="sleepOff" onclick="setSleep(null, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">Off</button>
          <button data-i18n="sleepAfterTrack" onclick="setSleep(null, true)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">After this track</button>
          <button data-i18n="min15" onclick="setSleep(15, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">15 minutes</button>
          <button data-i18n="min30" onclick="setSleep(30, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">30 minutes</button>
          <button data-i18n="min45" onclick="setSleep(45, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">45 minutes</button>
          <button data-i18n="min60" onclick="setSleep(60, false)" class="w-full text-left px-3 py-1.5 hover:bg-white/10 text-neutral-200 cursor-pointer">60 minutes</button>
        </div>
      </div>

      <!-- Mute + Volume -->
      <button id="btn-mute" onclick="cmdToggleMute()" title="Sesi Kapat/Aç" class="text-neutral-300 hover:text-white transition cursor-pointer ml-1">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.85" class="ytm-vol w-20 cursor-pointer" />
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
