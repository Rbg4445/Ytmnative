[package]
name = "ytm-iced-proto"
version = "0.1.0"
edition = "2021"
description = "Prototype: YTM Native home screen with iced (native Rust UI) to compare look and RAM with the Tauri/WebView2 UI."
publish = false

[dependencies]
iced = { version = "=0.13.1", features = ["image", "svg", "tokio", "advanced"] }
rustypipe = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
