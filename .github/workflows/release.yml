name: Release Windows & Linux Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: iced-app

      - name: Build release binary (iced UI)
        run: cargo build --release --manifest-path iced-app/Cargo.toml

      - name: Build Windows Setup installer & Portable ZIP
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc installer/ytm-native-iced.iss
          Compress-Archive -Path iced-app/target/release/ytm-native.exe, LICENSE, README.md -DestinationPath "dist/YTM-Native-$ver-windows-x64.zip" -Force

      - name: Publish Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            iced-app/target/release/ytm-native.exe
            dist/YTM-Native-Setup-*.exe
            dist/YTM-Native-*-windows-x64.zip
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libasound2-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: iced-app

      - name: Build Linux release & package .deb + .tar.gz
        run: |
          cargo build --release --manifest-path iced-app/Cargo.toml
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          PKG_ROOT="/tmp/ytm-native_${VER}_amd64"
          mkdir -p "$PKG_ROOT/DEBIAN" \
                   "$PKG_ROOT/usr/bin" \
                   "$PKG_ROOT/usr/share/applications" \
                   "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"
          cp iced-app/target/release/ytm-native "$PKG_ROOT/usr/bin/ytm-native"
          chmod 755 "$PKG_ROOT/usr/bin/ytm-native"
          cp icons/icon.png "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/ytm-native.png"
          printf "[Desktop Entry]\nName=YTM Native\nComment=Ultra-lightweight pure-Rust YouTube Music desktop client (iced UI)\nExec=/usr/bin/ytm-native\nIcon=ytm-native\nTerminal=false\nType=Application\nCategories=AudioVideo;Audio;Player;Music;\n" > "$PKG_ROOT/usr/share/applications/ytm-native.desktop"
          printf "Package: ytm-native\nVersion: ${VER}\nSection: sound\nPriority: optional\nArchitecture: amd64\nDepends: libgtk-3-0, libasound2t64 | libasound2, libdbus-1-3, libayatana-appindicator3-1, libxkbcommon0\nMaintainer: Rbg4445 <https://github.com/Rbg4445/Ytmnative>\nDescription: Ultra-lightweight pure-Rust YouTube Music desktop client (iced UI)\n" > "$PKG_ROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG_ROOT" "dist/ytm-native_${VER}_amd64.deb"
          tar -czf "dist/YTM-Native-${VER}-linux-x64.tar.gz" -C iced-app/target/release ytm-native

      - name: Publish Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/ytm-native_*_amd64.deb
            dist/YTM-Native-*-linux-x64.tar.gz
          generate_release_notes: true
