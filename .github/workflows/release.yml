name: Release Windows & Linux Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Build Windows Setup installer & Portable ZIP
        shell: powershell
        run: |
          iscc installer/ytm-native.iss
          Compress-Archive -Path target/release/ytm-native.exe, LICENSE, README.md -DestinationPath dist/YTM-Native-2.0.0-windows-x64.zip -Force

      - name: Publish Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/release/ytm-native.exe
            dist/YTM-Native-Setup-*.exe
            dist/YTM-Native-*-windows-x64.zip
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Linux release & package .deb + .tar.gz
        run: |
          cargo build --release
          mkdir -p dist
          PKG_ROOT="/tmp/ytm-native_2.0.0_amd64"
          mkdir -p "$PKG_ROOT/DEBIAN" \
                   "$PKG_ROOT/usr/bin" \
                   "$PKG_ROOT/usr/share/applications" \
                   "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"
          cp target/release/ytm-native "$PKG_ROOT/usr/bin/ytm-native"
          chmod 755 "$PKG_ROOT/usr/bin/ytm-native"
          cp icons/icon.png "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/ytm-native.png"
          printf "[Desktop Entry]\nName=YTM Native\nComment=Ultra-lightweight pure-Rust YouTube Music desktop client\nExec=/usr/bin/ytm-native\nIcon=ytm-native\nTerminal=false\nType=Application\nCategories=AudioVideo;Audio;Player;Music;\n" > "$PKG_ROOT/usr/share/applications/ytm-native.desktop"
          printf "Package: ytm-native\nVersion: 2.0.0\nSection: sound\nPriority: optional\nArchitecture: amd64\nDepends: libwebkit2gtk-4.1-0, libgtk-3-0, libasound2t64 | libasound2, libdbus-1-3, libayatana-appindicator3-1\nMaintainer: Rbg4445 <https://github.com/Rbg4445/Ytmnative>\nDescription: Ultra-lightweight pure-Rust YouTube Music desktop client\n" > "$PKG_ROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG_ROOT" dist/ytm-native_2.0.0_amd64.deb
          tar -czf dist/YTM-Native-2.0.0-linux-x64.tar.gz -C target/release ytm-native

      - name: Publish Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/ytm-native_*_amd64.deb
            dist/YTM-Native-*-linux-x64.tar.gz
          generate_release_notes: true
